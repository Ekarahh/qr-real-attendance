<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session - QR Attendance</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="page">
      <h1>QR Attendance</h1>
      <nav>
        <a href="/">Sessions</a>
        <a href="/records">Records</a>
        <a href="/scan">Scan</a>
        <a href="/logout">Log out</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <div class="card center">
      <h2 id="sessionTitle">Loading...</h2>
      <p class="muted">Students scan this with their phone camera to check in.</p>

      <img id="qrImage" class="qr" alt="QR code for this session">
      <p class="code" id="sessionCode"></p>
      <p class="muted" id="checkinUrl"></p>

      <p>
        <button id="toggleButton" class="red">Close attendance</button>
        <a class="button grey" id="csvLink" href="#">Download CSV</a>
      </p>
    </div>

    <div class="card">
      <h2>Checked in <span class="muted" id="count"></span></h2>
      <p class="muted">This list refreshes on its own every 5 seconds.</p>
      <div id="attendeeList"><p class="muted">Loading...</p></div>
    </div>
  </div>

  <script>
    // The session id is the last part of the address, e.g. /session/3
    const sessionId = window.location.pathname.split('/').pop();
    let isOpen = true;

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function loadSession() {
      fetch('/api/sessions/' + sessionId)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.error) {
            document.getElementById('sessionTitle').textContent = data.error;
            return;
          }

          isOpen = data.session.is_open === 1;

          document.getElementById('sessionTitle').textContent = data.session.title;
          document.getElementById('qrImage').src = data.qrImage;
          document.getElementById('sessionCode').textContent = data.session.code;
          document.getElementById('checkinUrl').textContent = data.checkinUrl;
          document.getElementById('csvLink').href = '/export.csv?session=' + sessionId;

          const button = document.getElementById('toggleButton');
          button.textContent = isOpen ? 'Close attendance' : 'Re-open attendance';
          button.className = isOpen ? 'red' : '';
        });
    }

    function loadAttendees() {
      fetch('/api/records?session=' + sessionId)
        .then(function (res) { return res.json(); })
        .then(function (rows) {
          document.getElementById('count').textContent = '(' + rows.length + ')';
          const box = document.getElementById('attendeeList');

          if (rows.length === 0) {
            box.innerHTML = '<p class="muted">Nobody has scanned the code yet.</p>';
            return;
          }

          let html = '<table><tr><th>#</th><th>Name</th><th>Student ID</th><th>Time</th></tr>';
          rows.forEach(function (row, index) {
            html += '<tr>' +
              '<td>' + (rows.length - index) + '</td>' +
              '<td>' + escapeHtml(row.student_name) + '</td>' +
              '<td>' + escapeHtml(row.student_id) + '</td>' +
              '<td>' + new Date(row.checked_in_at).toLocaleTimeString() + '</td>' +
              '</tr>';
          });
          box.innerHTML = html + '</table>';
        });
    }

    document.getElementById('toggleButton').addEventListener('click', function () {
      fetch('/api/sessions/' + sessionId + '/toggle', { method: 'POST' })
        .then(function (res) { return res.json(); })
        .then(function () { loadSession(); });
    });

    loadSession();
    loadAttendees();

    // Keep the list fresh while the teacher has the QR on the screen.
    setInterval(loadAttendees, 5000);
  </script>
</body>
</html>
