<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessions - QR Attendance</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="page">
      <h1>QR Attendance</h1>
      <nav>
        <a href="/">Sessions</a>
        <a href="/records">Records</a>
        <a href="/scan">Scan</a>
        <a href="/logout">Log out</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <div class="card">
      <h2>Start a new session</h2>
      <form id="newSessionForm">
        <label for="title">What is this session called?</label>
        <input type="text" id="title" placeholder="e.g. CSC 201 - Friday lecture" required>
        <button type="submit">Create session and show QR</button>
      </form>
    </div>

    <div class="card">
      <h2>Your sessions</h2>
      <div id="sessionList"><p class="muted">Loading...</p></div>
    </div>
  </div>

  <script>
    // Turn "2026-08-20T09:15:00.000Z" into something a person can read.
    function readableDate(text) {
      return new Date(text).toLocaleString();
    }

    function loadSessions() {
      fetch('/api/sessions')
        .then(function (res) { return res.json(); })
        .then(function (sessions) {
          const box = document.getElementById('sessionList');

          if (sessions.length === 0) {
            box.innerHTML = '<p class="muted">No sessions yet. Create one above to get started.</p>';
            return;
          }

          let html = '<table><tr><th>Session</th><th>Code</th><th>Created</th>' +
                     '<th>Present</th><th>Status</th><th></th></tr>';

          sessions.forEach(function (s) {
            const tag = s.is_open
              ? '<span class="tag">Open</span>'
              : '<span class="tag closed">Closed</span>';

            html += '<tr>' +
              '<td>' + escapeHtml(s.title) + '</td>' +
              '<td>' + s.code + '</td>' +
              '<td>' + readableDate(s.created_at) + '</td>' +
              '<td>' + s.total + '</td>' +
              '<td>' + tag + '</td>' +
              '<td><a href="/session/' + s.id + '">Open</a></td>' +
              '</tr>';
          });

          box.innerHTML = html + '</table>';
        });
    }

    // Names come from users, so escape them before putting them in the page.
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('newSessionForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const title = document.getElementById('title').value;

      fetch('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.error) {
            alert(data.error);
            return;
          }
          // Go straight to the QR code for the session we just made.
          window.location.href = '/session/' + data.id;
        });
    });

    loadSessions();
  </script>
</body>
</html>
