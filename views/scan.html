<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan - QR Attendance</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Free library that reads QR codes from the camera -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <header>
    <div class="page">
      <h1>QR Attendance</h1>
      <nav>
        <a href="/">Sessions</a>
        <a href="/records">Records</a>
        <a href="/scan">Scan</a>
        <a href="/logout">Log out</a>
      </nav>
    </div>
  </header>

  <div class="page narrow">
    <div class="card">
      <h2>Scan a session QR code</h2>
      <p class="muted">
        Most phones can read the QR code with the normal camera app. This page is here for
        laptops, or for phones where the camera app does not open links.
      </p>

      <div id="reader"></div>

      <div id="status" class="message" style="display: none;"></div>

      <p>
        <button id="startButton">Start camera</button>
        <button id="stopButton" class="red" style="display: none;">Stop camera</button>
      </p>

      <hr style="border: none; border-top: 1px solid var(--line); margin: 20px 0;">

      <h2>No camera? Type the code</h2>
      <form id="codeForm">
        <label for="code">8 letter code printed under the QR</label>
        <input type="text" id="code" placeholder="K7P2QX9M" maxlength="8" required>
        <button type="submit">Go to check in</button>
      </form>
    </div>
  </div>

  <script>
    let scanner = null;

    function showStatus(text, kind) {
      const box = document.getElementById('status');
      box.textContent = text;
      box.className = 'message ' + kind;
      box.style.display = 'block';
    }

    // Runs once the camera reads a QR code successfully.
    function onScanSuccess(decodedText) {
      showStatus('Code found, opening the check in page...', 'success');

      if (scanner) {
        scanner.stop();
      }

      // Our QR codes hold a full link, so we can just follow it.
      // If someone scans a plain code instead, build the link ourselves.
      if (decodedText.indexOf('http') === 0) {
        window.location.href = decodedText;
      } else {
        window.location.href = '/s/' + decodedText.trim().toUpperCase();
      }
    }

    document.getElementById('startButton').addEventListener('click', function () {
      scanner = new Html5Qrcode('reader');

      scanner.start(
        { facingMode: 'environment' },       // use the back camera when there is one
        { fps: 10, qrbox: 250 },
        onScanSuccess
      ).then(function () {
        document.getElementById('startButton').style.display = 'none';
        document.getElementById('stopButton').style.display = 'inline-block';
      }).catch(function () {
        showStatus('Could not open the camera. Check that you allowed camera access.', 'error');
      });
    });

    document.getElementById('stopButton').addEventListener('click', function () {
      if (scanner) {
        scanner.stop();
      }
      document.getElementById('startButton').style.display = 'inline-block';
      document.getElementById('stopButton').style.display = 'none';
    });

    document.getElementById('codeForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const code = document.getElementById('code').value.trim().toUpperCase();
      window.location.href = '/s/' + code;
    });
  </script>
</body>
</html>
