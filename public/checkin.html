<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check in - QR Attendance</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page narrow" style="padding-top: 40px;">
    <div class="card">
      <h2 id="sessionTitle">Loading...</h2>
      <p class="muted">Fill this in to be marked present.</p>

      <div id="message" class="message" style="display: none;"></div>

      <form id="checkinForm" style="display: none;">
        <label for="studentName">Full name</label>
        <input type="text" id="studentName" required>

        <label for="studentId">Student ID / matric number</label>
        <input type="text" id="studentId" required>

        <button type="submit" class="full">Check me in</button>
      </form>
    </div>
    <p class="muted center">QR Attendance</p>
  </div>

  <script>
    // The code is the last part of the address, e.g. /s/K7P2QX9M
    const code = window.location.pathname.split('/').pop().toUpperCase();

    function showMessage(text, kind) {
      const box = document.getElementById('message');
      box.textContent = text;
      box.className = 'message ' + kind;
      box.style.display = 'block';
    }

    // First check that the QR code belongs to a real, open session.
    fetch('/api/public/sessions/' + code)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) {
          document.getElementById('sessionTitle').textContent = 'Sorry';
          showMessage(data.error, 'error');
          return;
        }

        document.getElementById('sessionTitle').textContent = data.title;

        if (data.is_open === 0) {
          showMessage('Attendance for this session is closed.', 'error');
          return;
        }

        document.getElementById('checkinForm').style.display = 'block';
      });

    document.getElementById('checkinForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const button = event.target.querySelector('button');
      button.disabled = true;
      button.textContent = 'Sending...';

      fetch('/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code: code,
          studentName: document.getElementById('studentName').value,
          studentId: document.getElementById('studentId').value
        })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.error) {
            showMessage(data.error, 'error');
            button.disabled = false;
            button.textContent = 'Check me in';
            return;
          }

          // Success, so hide the form and say thank you.
          document.getElementById('checkinForm').style.display = 'none';
          showMessage('Done! ' + data.name + ', you are marked present for ' + data.title + '.', 'success');
        });
    });
  </script>
</body>
</html>
